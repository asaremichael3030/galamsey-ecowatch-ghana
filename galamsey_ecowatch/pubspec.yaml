name: galamsey_ecowatch
description: Galamsey EcoWatch Ghana - Environmental monitoring and illegal mining reporting system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0

  # State Management
  provider: ^6.0.5

  # Navigation
  go_router: ^13.0.1

  # HTTP & API
  dio: ^5.4.0
  logger: ^2.0.2+1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # Image & Media
  image_picker: ^1.0.5
  file_picker: ^6.1.1

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # UI Components
  fluttertoast: ^8.2.4
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Charts & Analytics
  fl_chart: ^0.66.0

  # Notifications
  flutter_local_notifications: ^16.1.0
  timezone: ^0.9.2

  # Utilities
  connectivity_plus: ^5.0.2
  permission_handler: ^11.0.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/